  };
  var inject = '<script>var PRESET_CLOUD=' + JSON.stringify(preset) + ';<' + '/script>';
  var out = src.replace('<script>', inject + '<script>');
  if (out === src) return toast('生成失败：未找到注入点');
  download(APP.data.settings.className + '操行分系统_全班分发版.html', out, 'text/html');
  toast('已生成：把该文件发到班级群即可');
}
function copyText(t, tip) {
  try {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast(tip || '已复制');
  } catch (e) { toast('复制失败，请手动选中复制'); }
}
function showRules() {
  var a = ADD_ITEMS.map(function (x) {
    return '<div class="kv"><span>' + esc(x.name) + '</span><b>+' + (x.fixed ? x.val : (x.hours ? '0.5/小时，单次≤' + x.cap : x.min + '-' + x.max)) + '</b></div>';
  }).join('');
  var b = SUB_ITEMS.map(function (x) {
    return '<div class="kv"><span>' + esc(x.name) + '</span><b class="no">-' + (x.fixed ? x.val : x.min + '-' + x.max) + '</b></div>';
  }).join('');
  dialog('评分标准速查（细则表2/表3/表4）',
    '<div style="font-size:13.5px"><b>一、加分项目</b>' + a +
    '<hr class="sep"><b>二、减分项目</b>' + b +
    '<hr class="sep"><b>三、宿舍卫生阶梯（周平均分）</b>' +
    '<div class="kv"><span>96分及以上</span><b>每高1分加1分（100→+8）</b></div>' +
    '<div class="kv"><span>95分</span><b>+3</b></div>' +
    '<div class="kv"><span>90-94分</span><b>每高1分加0.5（90→+0.5）</b></div>' +
    '<div class="kv"><span>85-89分</span><b>+0.5</b></div>' +
    '<div class="kv"><span>80-84分</span><b>0</b></div>' +
    '<div class="kv"><span>79-75分</span><b class="no">-0.5</b></div>' +
    '<div class="kv"><span>75分以下</span><b class="no">每降1分扣0.2（最多-5）</b></div>' +
    '<div class="kv"><span>学期每周均≥90分</span><b>学期末每人+1</b></div>' +
    '<div class="note">同一项目或赛事获多个奖项按最高奖次加分，不重复累计；每学期加分累计不超过 25 分。</div></div>',
    '<button class="btn" onclick="closeDialog()">关闭</button>');
}
function boot() {
  APP.data = loadLocal();
  if (!APP.data || !APP.data.users || !APP.data.users.length) {
    APP.data = defaults(); seed(); saveLocal();
  }
  var s = APP.data.settings;
  if (!s.cloud) s.cloud = { type: 'none', gistId: '', gistToken: '', restGet: '', restPut: '', restHeaders: '' };
  /* 内置数据快照：网页里自带最新全班数据，同学打开即看到最新分，无需任何配置 */
  if (window.PRESET_DATA && window.PRESET_DATA.users && window.PRESET_DATA.users.length) {
    var pd = window.PRESET_DATA, pr = pd.meta && pd.meta.presetRev || 1;
    var lpr = APP.data.meta && APP.data.meta.presetRev || 0;
    if (!lpr && (APP.data.meta.rev || 1) <= 1 && !(APP.data.records || []).length) {
      APP.data = JSON.parse(JSON.stringify(pd));   /* 新设备：直接用网页内置的最新数据 */
    } else if (pr > lpr) {
      APP.data = mergeData(pd, APP.data);          /* 老设备：以最新数据为底，保留本机新增 */
    }
    APP.data.meta.presetRev = pr;
    saveLocal();
  }
  if (!s.terms || !s.terms.length) s.terms = [{ name: s.term, weeks: s.termWeeks || 18 }];
  if (!APP.data.rooms) APP.data.rooms = [];
  if (!APP.data.dormWeeks) APP.data.dormWeeks = [];
  if (!APP.data.appeals) APP.data.appeals = [];
  if (!APP.data.logs) APP.data.logs = [];
  if (!APP.data.meta) APP.data.meta = { rev: 1, updatedAt: Date.now() };
  /* 内置云端配置（网页里烧好的）：仅在"本机完全没配过云端"时才套用，
     绝不覆盖管理员已经配好的码云 / Gist 等配置 */
  if (window.PRESET_CLOUD && window.PRESET_CLOUD.type && window.PRESET_CLOUD.gistId) {
    var pc = window.PRESET_CLOUD, cur = s.cloud || {};
    var emptyLocal = (!cur.type || cur.type === 'none' || !cur.gistId);
    if (emptyLocal) {
      s.cloud = { type: pc.type, svc: pc.svc || 'jsonblob', gistId: pc.gistId, gistToken: pc.gistToken || '',
                  restGet: pc.restGet || '', restPut: pc.restPut || '', restHeaders: pc.restHeaders || '' };
      saveLocal();
    }
  }
  /* 链接携带云端配置：?cloud=ID&ct=类型&get=..&put=.. （把带参数的链接发给同学即可共用同一份数据） */
  try {
    var q = location.search || '';
    if (q) {
      var p = {};
      q.replace(/^\?/, '').split('&').forEach(function (kv) {
        var a = kv.split('='); if (a[0]) p[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
      });
      if (p.cloud) {
        var t = p.ct || 'jsonblob';
        s.cloud = { type: t, svc: p.svc || 'jsonblob', gistId: p.cloud, gistToken: p.tok || '', restGet: p.get || '', restPut: p.put || '', restHeaders: p.head || '' };
        saveLocal();
      }
    }
  } catch (e) {}
  render();
  autoPull();
  startAutoRefresh();
  /* 照片云端：启动拉取 + 每月自动清理一次 */
  try {
    if (typeof photoMonthlyCheck === 'function') photoMonthlyCheck();
    if (typeof photoPull === 'function') photoPull();
  } catch (pe) {}
  window.APP = APP;
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { boot: boot }; }
boot();

</script>
