<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>继保261 操行分管理系统</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f2f4f8;color:#1f2430;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:#2b6cff;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 90px}
.hide{display:none!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}
.muted{color:#8a93a5;font-size:13px}
.small{font-size:12.5px}

/* 登录 */
.loginbox{max-width:420px;margin:6vh auto 0;padding:22px 20px;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(30,40,80,.08)}
.logo{font-size:20px;font-weight:700;letter-spacing:.5px}
.logo small{display:block;font-weight:400;font-size:13px;color:#8a93a5;margin-top:4px;letter-spacing:0}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:#6b7488;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d8dde8;border-radius:10px;background:#fbfcfe;outline:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2b6cff;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:0;border-radius:10px;background:#2b6cff;color:#fff;font-weight:600;letter-spacing:.5px}
.btn:active{opacity:.85}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#eef2fb;color:#2b6cff}
.btn.gray{background:#e6e9f0;color:#5b6478}
.btn.danger{background:#e5484d}
.btn.ok{background:#12a150}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;font-weight:500}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:#fff;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(30,40,80,.06)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.card h3 .muted{font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f7f9fe;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:#8a93a5}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eef2fb;color:#48536b}
.badge.add{background:#e6f7ec;color:#12a150}
.badge.sub{background:#fdecec;color:#e5484d}
.badge.warn{background:#fff5e5;color:#b26a00}
.badge.admin{background:#e8efff;color:#2b6cff}
.badge.ro{background:#f0eefe;color:#6b4ce6}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11.5px;background:#f0f2f7;color:#6b7488;margin-right:4px}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#2b6cff,#5a8cff);color:#fff;padding:12px 14px;box-shadow:0 2px 12px rgba(43,108,255,.25)}
.topbar .t{font-size:16px;font-weight:700}
.topbar .s{font-size:12px;opacity:.9;margin-top:2px}
.topbar .who{font-size:12px;opacity:.95;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topbar .who b{background:rgba(255,255,255,.22);padding:1px 8px;border-radius:20px;font-weight:600}
.topbar .out{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid #e6e9f0;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar div{flex:1;text-align:center;font-size:11.5px;color:#8a93a5;padding:4px 0}
.tabbar div.on{color:#2b6cff;font-weight:700}
.tabbar div i{display:block;font-style:normal;font-size:19px;line-height:1.3}
@media(min-width:760px){
  .tabbar{max-width:820px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0;border:1px solid #e6e9f0;border-bottom:0}
}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid #eef0f6;text-align:left;white-space:nowrap}
.tbl th{color:#8a93a5;font-weight:600;font-size:12.5px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f7}
.list .item:last-child{border-bottom:0}
.list .item .g{flex:1;min-width:0}
.list .item .g .n{font-weight:600}
.list .item .g .d{font-size:12px;color:#8a93a5;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;border:1px solid #dfe4ef;background:#fff;font-size:13px;margin:0 6px 6px 0}
.chip.on{background:#2b6cff;border-color:#2b6cff;color:#fff}
.chip.add.on{background:#12a150;border-color:#12a150}
.chip.sub.on{background:#e5484d;border-color:#e5484d}
.scorebar{height:8px;border-radius:8px;background:#eef0f6;overflow:hidden;margin-top:6px}
.scorebar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#2b6cff,#5a8cff)}
.scorebar i.low{background:linear-gradient(90deg,#e5484d,#ff8a5a)}
.scorebar i.mid{background:linear-gradient(90deg,#f0a500,#ffd166)}
.dialog{position:fixed;inset:0;z-index:60;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.dialog .panel{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
@media(min-width:760px){.dialog{align-items:center}.dialog .panel{border-radius:16px;max-height:80vh}}
.dialog h3{margin:0 0 12px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:99;background:rgba(20,25,40,.9);color:#fff;padding:10px 16px;border-radius:22px;font-size:13.5px;max-width:80%;text-align:center}
.syncbar{position:fixed;left:0;right:0;top:0;z-index:50;background:#fff5e5;color:#b26a00;font-size:12px;padding:5px 12px;text-align:center;border-bottom:1px solid #ffe4b8}
.foot{text-align:center;color:#a3abbb;font-size:12px;padding:16px 0}
.search{width:100%;padding:10px 12px;border:1px solid #d8dde8;border-radius:10px;background:#fff;outline:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #eef0f6;font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
hr.sep{border:0;border-top:1px solid #f0f2f7;margin:12px 0}
.note{background:#f7f9fe;border-left:3px solid #2b6cff;padding:8px 10px;border-radius:6px;font-size:12.5px;color:#5b6478;margin-top:10px}
.ok{color:#12a150}.no{color:#e5484d}
</style>
</head>

>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+cc)>>>0;H[3]=(H[3]+d)>>>0;\n    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;\n  }\n  var out = '';\n  for (i = 0; i < 8; i++) { var v = H[i].toString(16); while (v.length < 8) v = '0' + v; out += v; }\n  return out;\n}\nfunction newSalt() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }\nfunction hashPwd(pwd, salt) { return sha256('JB261|' + salt + '|' + pwd + '|' + sha256(pwd)); }\nfunction uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\nfunction today() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }\nfunction nowTime() { var d = new Date(); return today() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }\nfunction p2(n) { return n < 10 ? '0' + n : '' + n; }\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction toHalf(v) { return Math.round(v * 2) / 2; }\nfunction isHalf(v) { return Math.abs(v * 2 - Math.round(v * 2)) < 1e-9; }\nfunction num(v, d) { v = parseFloat(v); return isNaN(v) ? (d || 0) : v; }\n\n/* ---------- 角色与权限 ---------- */\nvar ROLE = {\n  superadmin: { name: '最高管理员', desc: '全部权限：用户与权限、云端、设置、登记、导出' },\n  admin:      { name: '班委管理员', desc: '登记加减分、宿舍卫生、公示、申诉处理、导出' },\n  counselor:  { name: '辅导员（只读）', desc: '只能查看与导出，不能修改任何数据' },\n  student:    { name: '学生', desc: '查看本人操行分明细、提交自评与申诉' }\n};\nfunction roleName(r) { return (ROLE[r] || { name: r }).name; }\nfunction isStaff() { return APP.me && (APP.me.role === 'superadmin' || APP.me.role === 'admin' || APP.me.role === 'counselor'); }\nfunction canWrite() { return APP.me && (APP.me.role === 'superadmin' || APP.me.role === 'admin'); }\nfunction canManage() { return APP.me && APP.me.role === 'superadmin'; }\nfunction canSeeAll() { return isStaff(); }\nfunction guardWrite() {\n  if (!canWrite()) { toast(APP.me && APP.me.role =  saveLocal();\n  return { ok: true, mustChange: !!u.mustChange };\n}\nfunction setPwd(u, pwd) {\n  u.salt = newSalt(); u.hash = hashPwd(pwd, u.salt); u.mustChange = false; u.pwdAt = nowTime();\n}\nfunction checkPwdRule(p) {\n  if (!p || p.length < 6) return '密码至少 6 位';\n  if (p === '123456') return '不能继续使用初始密码 123456';\n  if (/^\\d+$/.test(p)) return '密码不能是纯数字，请混合字母或符号';\n  return '';\n}\n\n/* ---------- 规则：加分项 / 减分项（依据细则表2、表3） ---------- */\nvar ADD_ITEMS = [\n  { cat: '技能与荣誉', name: '课外技能考试（四六级/计算机二级/职业资格证等）', val: 3, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '报名并实际参加运动会', val: 0.5, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '运动会第1名', val: 3, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '运动会第2名', val: 2, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '运动会第3名', val: 1.5, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '运动会第4-8名', val: 1, unit: '项', fixed: true },\n  { cat: '体育活动类', name: '打破校/院记录（额外）', val: 5, unit: '次', fixed: true },\n  { cat: '文艺与竞赛类', name: '参加文艺晚会/演讲/辩论/知识竞赛（参与者）', val: 0.5, unit: '次', fixed: true },\n  { cat: '文艺与竞赛类', name: '文艺与竞赛三等奖', val: 1, unit: '次', fixed: true },\n  { cat: '文艺与竞赛类', name: '文艺与竞赛二等奖', val: 1.5, unit: '次', fixed: true },\n  { cat: '文艺与竞赛类', name: '文艺与竞赛一等奖', val: 2, unit: '次', fixed: true },\n  { cat: '班级建设与志愿服务', name: '志愿服务（0.5分/小时，单次上限1分）', val: null, unit: '小时', fixed: false, hours: true, cap: 1 },\n  { cat: '班级建设与志愿服务', name: '为班级提合理化建议并被采纳（0.5-1分）', val: null, unit: '次', fixed: false, min: 0.5, max: 1 },\n  { cat: '班级建设与志愿服务', name: '帮助班级获得集体荣誉（全班1-2分）', val: null, unit: '次', fixed: false, min: 1, max: 2, wholeClass: true }\n];\nvar SUB_ITEMS = [\n  { cat: '考勤与纪律', name: '无故旷课、早退', val: 3, unit: '次', fixed: true },\n  { cat: '考勤与纪律', name: '迟到、早退（10分钟以内）', val: 1, unit: '次', fixed: true },\n  { cat: '考勤与纪律', name: '课堂被任课老师点名批评（睡觉、玩手机等）', val: 1, unit: '次', fixed: true },\n  { cat: '考勤与纪律', name: '无故缺席要求参加的集体活动（班会、讲座等）', val: 1, unit: '次', fixed: true },\n  { cat: '宿舍与生活', name: '宿舍卫生检查 Raw, add: capped, sub: sub,\n    part: part, total: Math.round(total * 100) / 100, over: addRaw > s.bonusCap,\n    pass: total >= s.passLine, talk: total < s.talkLine, counselorTmp: counselorTmp, selfTmp: selfTmp,\n    records: rs\n  };\n}\n/* 班级在册学生（班委被设为管理员后仍属于在册学生，需正常计分） */\nfunction isClassMember(u) { return u.isClass === true || (u.isClass === undefined && u.role === 'student'); }\nfunction classmates() {\n  var out = [];\n  for (var i = 0; i < APP.data.users.length; i++) if (isClassMember(APP.data.users[i])) out.push(APP.data.users[i]);\n  return out;\n}\nfunction addRecord(o) {\n  if (!canWrite()) { toast(APP.me ? '当前账号（' + roleName(APP.me.role) + '）没有登记权限' : '请先登录'); return null; }\n  var s = APP.data.settings;\n  if (o.type === 'add') {\n    if (s.halfUnit) o.val = toHalf(o.val);\n  } else {\n    if (s.halfUnit) o.val = toHalf(o.val);\n  }\n  o.id = o.id || uid();\n  o.term = o.term || s.term;\n  o.date = o.date || today();\n  o.at = nowTime();\n  o.by = APP.me ? APP.me.name + '(' + APP.me.id + ')' : '系统';\n  APP.data.records.push(o);\n  return o;\n}\nfunction delRecord(id) {\n  for (var i = 0; i < APP.data.records.length; i++) {\n    if (APP.data.records[i].id === id) {\n      var r = APP.data.records.splice(i, 1)[0];\n      commit('撤销记录：' + r.name + ' ' + (r.type === 'add' ? '+' : '-') + r.val + '（' + r.sid + '）');\n      return true;\n    }\n  }\n  return false;\n}\n/* 学期末额外加分：学期内每周平均均达90及以上，每位成员+1 */\nfunction weekBonusApplied(term) {\n  var wk = APP.data.dormWeeks.filter(function (w) { return !term || w.term === term; });\n  var n = APP.data.settings.termWeeks || 18;\n  if (!wk.length || wk.length < n) return false;\n  for (var i = 0; i < wk.length; i++) if (wk[i].avg < 90) return false;\n  return true;\n}\n\n/* ================= 界面层（一）：外壳、登录、首页、我的成绩、登记 ================= */\nvar $ = function (id) { return document.getElementById(id); };\n\nfunction toast(msg, ms) {\n  var t = document.createElement('div');\n  t.className = 'toast'; t.textContent = msg;\n  $('toastRoot').appendChild(t);\n  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 2000);\n}\nfunction closeDialog() { $('dialogRoot').innerHTML = ''; }\nfunction dialog(title, bodyHtml, footHtml, onMount) {\n  $('dialogRoot').innerHTML = '<div class=\"dialog\" id=\"dlgMask\"><div class=\"panel\"><h3>' + esc(title) + '<\/h3>' +\n    '<div id=\"dlgBody\">' + bodyHtml + '<\/div><div class=\"row mt16\" id=\"dlgFoot\">' + (footHtml || '') + '<\/div><\/div><\/div>';\n  var mask = $('dlgMask');\n  mask.addEventListener('click', function (e) { if (e.target === mask) closeDialog(); });\n  if (onMount) onMount($('dlgBody'));\n}\nfunction confirmBox(title, msg, onYes) {\n  dialog(title, '<div style=\"font-size:14px;line-height:1.7\">' + msg + '<\/div>',\n    '<button class=\"btn gray\" onclick=\"closeDialog()\">取消<\/button><button class=\"btn danger\" id=\"cfmYes\">确定<\/button>',\n    function () { $('cfmYes').onclick = function () { closeDialog(); onYes(); }; });\n}\n\n/* ---------- 路由 ---------- */\nfunction go(view) { APP.view = view; render(); window.scrollTo(0, 0); }\nfunction render() {\n  var root = $('app');\n  if (!APP.me) { renderLogin(root); return; }\n  if (APP.me.mustChange) { renderChangePwd(root, true); return; }\n  root.innerHTML = shell();\n  var body = $('viewBody');\n  if (APP.view === 'home') body.innerHTML = viewHome();\n  else if (APP.view === 'entry') body.innerHTML = viewEntry();\n  else if (APP.view === 'dorm') body.innerHTML = viewDorm();\n  else if (APP.view === 'roster') body.innerHTML = viewRoster();\n  else if (APP.view === 'pub') body.innerHTML = viewPub();\n  else if (APP.view === 'manage') body.innerHTML = viewManage();\n  else body.innerHTML = viewHome();\n  if (APP.view === 'home') afterHome();\n  if (APP.view === 'entry') afterEntry();\n  if (APP.view === 'dorm') afterDorm();\n  if (APP.view === 'roster') afterRoster();\n  if (APP.view === 'pub') afterPub();\n  if (APP.view === 'manage') afterManage();\n  renderFoot();\n}\nfunction shell() {\n  var s = APP.data.settings, u = APP.me;\n  var tabs = isStaff() ? [\n    { k: 'home', i: '🏠', t: '总览' },\n    { k: 'entry', i: '📝', t: '登记' },\n    { k: 'dorm', i: '🛏️', t: '宿舍' },\n    { k: 'roster', i: '👥', t: '名册' },\n    { k: 'pub', i: '📢', t: '公示' }\n  ] : [\n    { k: 'home', i: '🏠', t: '我的' },\n    { k: 'pub', i: '📢', t: '公示' }\n  ];\n  if (canManage()) tabs.push({ k: 'manage', i: '⚙️', t: '管理' });\n  var allow = tabs.map(function (t) { return t.k; });\n  if (allow.indexOf(APP.view) < 0) APP.view = 'home';\n  var nav = '<div class=\"topbar\"><div class=\"t\">' + esc(s.className) + ' 操行分管理<\/div>' +\n    '<div class=\"s\">' + esc(s.school) + ' · ' + esc(s.term) + '<\/div>' +\n    '<div class=\"who\"><b>' + esc(u.name) + '<\/b><span>' + esc(roleName(u.role)) + '<\/span>' +\n    (u.role === 'student' && u.id ? '<span>学号 ' + esc(u.id) + '<\/span>' : '') +\n    '<button class=\"out\" onclick=\"logout()\">退出<\/button><\/div><\/div>';\n  var bar = '<div class=\"tabbar\">' + tabs.map(function (t) {\n    return '<div class=\"' + (APP.view === t.k ? 'on' : '') + '\" onclick=\"go(\\'' + t.k + '\\')\"><i>' + t.i + '<\/i>' + t.t + '<\/div>';\n  }).join('') + '<\/div>';\n  return nav + '<div class=\"wrap\" id=\"viewBody\"><\/div>' + bar;\n}\nfunction renderFoot() {\n  var c = APP.data.settings.cloud || {};\n  var mode = c.type === 'gist' ? '云端（GitHub Gist）' : (c.type === 'rest' ? '云端（自定义接口）' : (c.type === 'jsonblob' ? '云端（免注册）' : '本地单机模式'));\n  $('foot').innerHTML = SYS_NAME + ' · ' + mode + ' · 数据版本 v' + (APP.data.meta.rev || 1) +\n    '<br>依据《继保261学生操行分评定实施细则（修订版）》自动核算' +\n    '<br><a href=\"javascript:;\" onclick=\"showHelp()\">使用说明<\/a> · <a href=\"javascript:;\" onclick=\"showRules()\">评分标准速查<\/a>';\n}\nfunction logout() { APP.me = null; APP.view = 'home'; render(); }\n\n/* ---------- 登录 ---------- */\nfunction renderLogin(root) {\n  root.innerHTML = '<div class=\"loginbox\"><div class=\"logo\">' + SYS_NAME + '<small>' + esc(APP. np2 = $('cpNew2').value;\n  if (force && hashPwd(old, APP.me.salt) !== APP.me.hash) return toast('原密码不正确');\n  if (!force && hashPwd(old, APP.me.salt) !== APP.me.hash) return toast('原密码不正确');\n  if (checkPwdRule(np)) return toast(checkPwdRule(np));\n  if (np !== np2) return toast('两次输入的新密码不一致');\n  setPwd(APP.me, np);\n  commit('修改登录密码');\n  toast('密码修改成功');\n  APP.view = 'home'; render();\n}\nfunction resetPwd(sid) {\n  if (!canManage()) return toast('仅最高管理员可重置密码');\n  confirmBox('重置密码', '将把 <b>' + esc(sid) + '<\/b> 的密码重置为初始密码 <b>123456<\/b>，并强制其下次登录修改。', function () {\n    var u = findUser(sid); if (!u) return;\n    setPwd(u, '123456'); u.mustChange = true;\n    commit('重置密码：' + u.name + '(' + sid + ')');\n    toast('已重置'); render();\n  });\n}\n\n/* ---------- 首页 ---------- */\nfunction viewHome() {\n  var u = APP.me, s = APP.data.settings;\n  var h = '';\n  if (isClassMember(u)) {\n    var c = calcScore(u.id);\n    h += '<div class=\"card\" style=\"padding:0;box-shadow:none\"><h3>我的操行分<\/h3><\/div>';\n    h += scoreCard(u, c);\n    h += '<div class=\"card\"><h3>我的加减分明细 <span class=\"muted small\">共 ' + c.records.length + ' 条<\/span><\/h3>' + recordList(c.records, false) + '<\/div>';\n    h += '<div class=\"card\"><h3>学期自我评价（满分 ' + s.selfMax + ' 分）<\/h3>' + selfEvalBox(u) + '<\/div>';\n  }\n  if (isStaff()) {\n    var list = classmates(), sum = 0, ok = 0, low = 0, best = 0;\n    var arr = list.map(function (x) { var c = calcScore(x.id); return { u: x, c: c }; });\n    arr.forEach(function (x) { sum += x.c.total; if (x.c.pass) ok++; if (x.c.total < s.talkLine) low++; if (x.c.total > best) best = x.c.total; });\n    var avg = list.length ? Math.round(sum / list.length * 100) / 100 : 0;\n    h += '<div class=\"card\"><h3>班级总览 <span class=\"muted small\">' + esc(s.term) + '<\/span><\/h3><div class=\"grid3\">' +\n      '<div class=\"stat\"><b>' + list.length + '<\/b><span>班级人数<\/span><\/div>' +\n      '<div class=\"stat\"><b>' + avg + '<\/b><span>平均分<\/span><\/div>' +\ = id) rm = APP.data.rooms[i];\n  if (!rm) return;\n  window._rmSel = rm.members.slice();\n  dialog('编辑成员 · ' + rm.name, '<div class=\"field\"><label>搜索并选择成员<\/label><input id=\"rmSearch\" class=\"search\" placeholder=\"搜索姓名/学号\" oninput=\"roomPick()\"><\/div>' +\n    '<div id=\"rmPick\" style=\"max-height:260px;overflow:auto\"><\/div>',\n    '<button class=\"btn gray\" onclick=\"closeDialog()\">取消<\/button><button class=\"btn danger\" onclick=\"delRoom(\\'' + id + '\\')\">删除宿舍<\/button><button class=\"btn\" onclick=\"saveRoomMem(\\'' + id + '\\')\">保存<\/button>',\n    function () { roomPick(); });\n}\nfunction saveRoomMem(id) {\n  for (var i = 0; i < APP.data.rooms.length; i++) if (APP.data.rooms[i].id === id) APP.data.rooms[i].members = (window._rmSel || []).slice();\n  commit('修改宿舍成员');\n  closeDialog(); toast('已保存'); render();\n}\nfunction delRoom(id) {\n  confirmBox('删除宿舍', '删除后该宿舍的周记录与已生成的加减分记录将一并移除，确定吗？', function () {\n    APP.data.rooms = APP.data.rooms.filter(function (r) { return r.id !== id; });\n    var wk = APP.data.dormWeeks.filter(function (w) { return w.roomId === id; });\n    wk.forEach(function (w) { delWeekRecords(w.id); });\n    APP.data.dormWeeks = APP.data.dormWeeks.filter(function (w) { return w.roomId !== id; });\n    commit('删除宿舍'); render();\n  });\n}\nfunction weekForm(roomId) {\n  if (!guardWrite()) return;\n  var rm = null; for (var i = 0; i < APP.data.rooms.length; i++) if (APP.data.rooms[i].id === roomId) rm = APP.data.rooms[i];\n  if (!rm) return;\n  var nextWeek = APP.data.dormWeeks.filter(function (w) { return w.roomId === roomId; }).length + 1;\n  if (nextWeek > APP.data.settings.termWeeks) nextWeek = APP.data.settings.termWeeks;\n  var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];\n  dialog('录入周卫生分 · ' + rm.name,\n    '<div class=\"grid2\"><div class=\"field\"><label>周次<\/label><input id=\"wkNo\" type=\"number\" value=\"' + nextWeek + '\"><\/div>' +\n    '<div class=\"field\"><label>日期<\/label><input id=\"wkDate\" type=\"date\" value=\"' + today() + '\"><\/div><\/div>' +\n    '<div class=\"small muted mt8\">填写本周每日卫生检查得分（可只填已检查的天数）<\/div>' +\n    days.map(function (d, i) { return '<div class=\"field\" style=\"flex:0 0 46%\"><label>' + d + '<\/label><input class=\"wkDay\" type=\"number\" step=\"0.5\" placeholder=\"可空\"><\/div>'; }).join('') +\n    '<div id=\"wkPrev\" class=\"note\">填写后自动计算<\/div>',\n    '<button class=\"btn gray\" onclick=\"closeDialog()\">取消<\/button><button class=\"btn\" onclick=\"saveWeek(\\'' + roomId + '\\')\">确认写入<\/button>',\n    function () {\n      var ins = document.querySelectorAll('.wkDay');\n      for (var i = 0; i < ins.length; i++) ins[i].addEventListener('input', function () {\n        var vs = [], ins2 = document.querySelectorAll('.wkDay');\n        for (var j = 0; j < ins2.length; j++) if (ins2[j].value !== '') vs.push(num(ins2[j].value, 0));\n        var box = $('wkPrev');\n        if (!vs.length) { box.innerHTML = '填写后自动计算'; return; }\n        var avg = Math.round(vs.reduce(function (a, b) { return a + b; }, 0) / vs.length * 100) / 100;\n        var adj = dormAdjust(avg);\n        box.innerHTML = '平均分 <b>' + avg.toFixed(2) + '<\/b> → 按表4每人 <b>' + (adj >= 0 ? '+' : '') + adj + '<\/b> 分，将写入 ' + rm.members.length + ' 名成员';\n      });\n    });\n}\nfunction saveWeek(roomId) {\n  var rm = null; for (var i = 0; i < APP.data.rooms.length; i++) if (APP.data.rooms[i].id === roomId) rm = APP.data.rooms[i];\n  var week = parseInt($('wkNo').value, 10) || 1, date = $('wkDate').value || today();\n  var ins = document.querySelectorAll('.wkDay'), vs = [];\n  for (var j = 0; j < ins.length; j++) if (ins[j].value !== '') vs.push(num(ins[j].value, 0));\n  if (!vs.length) return toast('请至少填写一天的分值');\n  var avg = Math.round(vs.reduce(function (a, b) { return a + b; }, 0) / vs.length * 100) / 100;\n  var adj = dormAdjust(avg);\n  var w = { id: uid(), roomId: roomId, term: APP.data.settings.term, week: week, days: vs, avg: avg, adjust: adj, date: date };\n  var old = null;\n ) {\n    var k = l.t + '|' + l.who + '|' + l.msg;\n    if (!lk[k]) { base.logs.push(l); lk[k] = 1; }\n  });\n  base.logs.sort(function (a, b) { return String(b.t) < String(a.t) ? -1 : 1; });\n  if (base.logs.length > 500) base.logs.length = 500;\n  base.meta = {\n    rev: Math.max(remote.meta && remote.meta.rev || 0, lmeta.rev || 0),\n    updatedAt: Date.now(),\n    seed: (remote.meta && remote.meta.seed) || lmeta.seed || 0,\n    syncedAt: remote.meta && remote.meta.syncedAt,\n    termBonusDone: (remote.meta && remote.meta.termBonusDone) || lmeta.termBonusDone || false\n  };\n  return base;\n}\n\nfunction cloudRead(cb) {\n  var c = cloudCfg();\n  if (c.type === 'gist') {\n    if (!c.gistId) return cb(null, null);\n    ajax('GET', 'https://api.github.com/gists/' + c.gistId + '?t=' + Date.now(), null,\n      { 'Authorization': 'token ' + c.gistToken, 'Accept': 'application/vnd.github+json' }, function (e, t) {\n        if (e) return cb(e);\n        try {\n          var j = JSON.parse(t);\n          var f = j.files && j.files[CLOUD_FILE];\n          if (!f) return cb(new Error('云端文件中没有 ' + CLOUD_FILE));\n          cb(null, JSON.parse(f.content));\n        } catch (err) { cb(err); }\n      });\n  } else if (c.type === 'jsonblob') {\n    if (!c.gistId) return cb(null, null);\n    ajax('GET', 'https://jsonblob.com/api/jsonBlob/' + c.gistId + '?t=' + Date.now(), null, {}, function (e, t) {\n      if (e) return cb(e);\n      try { cb(null, JSON.parse(t)); } catch (err) { cb(err); }\n    });\n  } else if (c.type === 'rest') {\n    if (!c.restGet) return cb(null, null);\n    var h = {}; try { if (c.restHeaders) h = JSON.parse(c.restHeaders); } catch (e) {}\n    ajax('GET', c.restGet + (c.restGet.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), null, h, function (e, t) {\n      if (e) return cb(e);\n      try { cb(null, JSON.parse(t)); } catch (err) { cb(err); }\n    });\n  } else cb(null, null);\n}\nfunction cloudWrite(obj, cb) {\n  var c = cloudCfg(), body = JSON.stringif rn; }\n    var rrev = remote && remote.meta ? (remote.meta.rev || 0) : 0;\n    var lrev = APP.data.meta.rev || 0;\n    if (!force && rrev > lrev) {\n      /* 自动合并：以云端为底，保留本机新增的记录、改过的密码与自评，再上传 */\n      var keep = APP.me ? { id: APP.me.id } : null;\n      APP.data = mergeData(remote, APP.data);\n      if (keep) { var ku = findUser(keep.id); if (ku) APP.me = ku; }\n      saveLocal();\n      syncMsg('☁️ 已合并云端新数据（v' + rrev + '）并继续上传…', true);\n    }\n    APP.data.meta.rev = Math.max(lrev, rrev) + 1;\n    cloudWrite(APP.data, function (e2) {\n      APP.syncing = false;\n      if (e2) { syncMsg('⚠️ 上传失败：' + e2.message); return; }\n      APP.data.meta.syncedAt = nowTime(); saveLocal();\n      syncMsg('✅ 已同步到云端（v' + APP.data.meta.rev + '）');\n      if (APP.view === 'manage') render();\n    });\n  });\n}\nfunction cloudPull(manual) {\n  var c = cloudCfg();\n  if (c.type === 'none') { if (manual) toast('当前为本地单机模式'); return; }\n  syncMsg('☁️ 正在从云端读取…', true);\n  cloudRead(function (e, remote) {\n    if (e) { syncMsg('⚠️ 读取失败：' + e.message); if (manual) toast('读取失败：' + e.message); return; }\n    if (!remote || !remote.users) { syncMsg('云端暂无数据，将上传本地数据'); pushNow(true); return; }\n    var rrev = remote.meta ? (remote.meta.rev || 0) : 0, lrev = APP.data.meta.rev || 0;\n    if (!manual && rrev <= lrev) { syncMsg('✅ 已是最新（v' + lrev + '）'); return; }\n    if (manual && rrev < lrev) {\n      confirmBox('版本确认', '云端版本 v' + rrev + ' 低于本地 v' + lrev + '，确定要用云端覆盖本地吗？', function () {\n        APP.data = remote; saveLocal(); APP.me = null; render(); toast('已从云端恢复');\n      });\n      syncMsg('');\n      return;\n    }\n    APP.data = remote; saveLocal();\n    syncMsg('✅ 已同步云端数据（v' + rrev + '）');\n    if (manual) toast('已拉取云端最新数据');\n    if (APP.me && !findUser(APP.me.id)) APP.me = null;\n    render();\n  });\n}\nfunction cloudTest() {\n  var c = cloudCfg();\n  if (c.type === 'none') return toast('请先选择云端方式');\n  syncMsg('☁️ 正在测试连接…', true);\n  cloudRead(function (e, remote) {\n    if (e) { sync /* 宿舍卫生阶梯（细则表4） */
function dormAdjust(avg) {
  var v = 0;
  if (avg >= 95) v = avg - 92;                 /* 95→3 96→4 … 100→8 */
  else if (avg >= 90) v = (avg - 89) * 0.5;    /* 90→0.5 … 94→2.5 */
  else if (avg >= 85) v = 0.5;
  else if (avg >= 80) v = 0;
  else if (avg >= 75) v = -0.5;
  else v = -Math.min(5, (75 - avg) * 0.2);     /* 74→-0.2 … 50及以下→-5 */
  if (APP.data && APP.data.settings.halfUnit) v = toHalf(v);
  return Math.round(v * 100) / 100;
}

/* ---------- 计算 ---------- */
function recordsOf(sid, term) {
  var out = [];
  for (var i = 0; i < APP.data.records.length; i++) {
    var r = APP.data.records[i];
    if (r.sid === sid && (!term || r.term === term)) out.push(r);
  }
  return out;
}
function calcScore(sid) {
  var s = APP.data.settings, u = findUser(sid), rs = recordsOf(sid, s.term);
  var add = 0, sub = 0, addRaw = 0;
  for (var i = 0; i < rs.length; i++) {
    if (rs[i].type === 'add') { addRaw += rs[i].val; }
    else { sub += rs[i].val; }
  }
  var capped = Math.min(addRaw, s.bonusCap);
  var counselor = (u && u.eval && u.eval[s.term] && u.eval[s.term].counselor != null) ? u.eval[s.term].counselor : s.defCounselor;
  var self = (u && u.eval && u.eval[s.term] && u.eval[s.term].self != null) ? u.eval[s.term].self : s.defSelf;
  var counselorTmp = !(u && u.eval && u.eval[s.term] && u.eval[s.term].counselor != null);
  var selfTmp = !(u && u.eval && u.eval[s.term] && u.eval[s.term].self != null);
  var part = capped - sub;
  var total = s.base + counselor + self + part;
  if (total > 100) total = 100;
  return {
    base: s.base, counselor: counselor, self: self, addRaw: addRaw, add: capped, sub: sub,
    part: part, total: Math.round(total * 100) / 100, over: addRaw > s.bonusCap,
    pass: total >= s.passLine, talk: total < s.talkLine, counselorTmp: counselorTmp, selfTmp: selfTmp,
    records: rs
  };
}
/* 班级在册学生（班委被设为管理员后仍属于在册学生，需正常计分） */
function isClassMember(u) { return u.isClass === true || (u.isClass === undefined && u.role === 'student'); }
function classmates() {
  var out = [];
  for (var i = 0; i < APP.data.users.length; i++) if (isClassMember(APP.data.users[i])) out.push(APP.data.users[i]);
  return out;
}
function addRecord(o) {
  if (!canWrite()) { toast(APP.me ? '当前账号（' + roleName(APP.me.role) + '）没有登记权限' : '请先登录'); return null; }
  var s = APP.data.settings;
  if (o.type === 'add') {
    if (s.halfUnit) o.val = toHalf(o.val);
  } else {
    if (s.halfUnit) o.val = toHalf(o.val);
  }
  o.id = o.id || uid();
  o.term = o.term || s.term;
  o.date = o.date || today();
  o.at = nowTime();
  o.by = APP.me ? APP.me.name + '(' + APP.me.id + ')' : '系统';
  APP.data.records.push(o);
  return o;
}
function delRecord(id) {
  for (var i = 0; i < APP.data.records.length; i++) {
    if (APP.data.records[i].id === id) {
      var r = APP.data.records.splice(i, 1)[0];
      commit('撤销记录：' + r.name + ' ' + (r.type === 'add' ? '+' : '-') + r.val + '（' + r.sid + '）');
      return true;
    }
  }
  return false;
}
/* 学期末额外加分：学期内每周平均均达90及以上，每位成员+1 */
function weekBonusApplied(term) {
  var wk = APP.data.dormWeeks.filter(function (w) { return !term || w.term === term; });
  var n = APP.data.settings.termWeeks || 18;
  if (!wk.length || wk.length < n) return false;
  for (var i = 0; i < wk.length; i++) if (wk[i].avg < 90) return false;
  return true;
}

function doLogin() {

/* ---------- 修改密码（首次强制） ---------- */
function renderChangePwd(root, force) {
  root.innerHTML = '<div class="loginbox"><div class="logo">' + (force ? '首次登录 · 必须修改初始密码' : '修改密码') +
    '<small>为保障账号安全，初始密码 123456 不可继续使用</small></div>' +
    '<div class="field"><label>原密码</label><input id="cpOld" type="password" value="' + (force ? esc(arguments[2] || '') : '') + '"></div>' +
    '<div class="field"><label>新密码（至少6位，不能是纯数字）</label><input id="cpNew" type="password" placeholder="建议 字母+数字 组合"></div>' +
    '<div class="field"><label>确认新密码</label><input id="cpNew2" type="password"></div>' +
    '<button class="btn block mt16" onclick="doChangePwd(' + (force ? '1' : '0') + ')">确认修改</button>' +
    (force ? '<div class="note">修改成功后即可进入系统；未修改前无法使用任何功能。</div>' : '<button class="btn gray block mt8" onclick="go(\'home\')">返回</button>') +
    '</div>';
}
function doChangePwd(force) {
  var old = $('cpOld').value, np = $('cpNew').value, np2 = $('cpNew2').value;
  if (force && hashPwd(old, APP.me.salt) !== APP.me.hash) return toast('原密码不正确');
  if (!force && hashPwd(old, APP.me.salt) !== APP.me.hash) return toast('原密码不正确');
  if (checkPwdRule(np)) return toast(checkPwdRule(np));
  if (np !== np2) return toast('两次输入的新密码不一致');
  setPwd(APP.me, np);
  commit('修改登录密码');
  toast('密码修改成功');
  APP.view = 'home'; render();
}
function resetPwd(sid) {
  if (!canManage()) return toast('仅最高管理员可重置密码');
  confirmBox('重置密码', '将把 <b>' + esc(sid) + '</b> 的密码重置为初始密码 <b>123456</b>，并强制其下次登录修改。', function () {
    var u = findUser(sid); if (!u) return;
    setPwd(u, '123456'); u.mustChange = true;
    commit('重置密码：' + u.name + '(' + sid + ')');
    toast('已重置'); render();
  });
}

function weekForm(roomId) {
  if (!guardWrite()) return;
  var rm = null; for (var i = 0; i < APP.data.rooms.length; i++) if (APP.data.rooms[i].id === roomId) rm = APP.data.rooms[i];
  if (!rm) return;
  var nextWeek = APP.data.dormWeeks.filter(function (w) { return w.roomId === roomId; }).length + 1;
  if (nextWeek > APP.data.settings.termWeeks) nextWeek = APP.data.settings.termWeeks;
  var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  dialog('录入周卫生分 · ' + rm.name,
    '<div class="grid2"><div class="field"><label>周次</label><input id="wkNo" type="number" value="' + nextWeek + '"></div>' +
    '<div class="field"><label>日期</label><input id="wkDate" type="date" value="' + today() + '"></div></div>' +
    '<div class="small muted mt8">填写本周每日卫生检查得分（可只填已检查的天数）</div>' +
    days.map(function (d, i) { return '<div class="field" style="flex:0 0 46%"><label>' + d + '</label><input class="wkDay" type="number" step="0.5" placeholder="可空"></div>'; }).join('') +
    '<div id="wkPrev" class="note">填写后自动计算</div>',
    '<button class="btn gray" onclick="closeDialog()">取消</button><button class="btn" onclick="saveWeek(\'' + roomId + '\')">确认写入</button>',
    function () {
      var ins = document.querySelectorAll('.wkDay');
      for (var i = 0; i < ins.length; i++) ins[i].addEventListener('input', function () {
        var vs = [], ins2 = document.querySelectorAll('.wkDay');

        if (!vs.length) { box.innerHTML = '填写后自动计算'; return; }
        var avg = Math.round(vs.reduce(function (a, b) { return a + b; }, 0) / vs.length * 100) / 100;
        var adj = dormAdjust(avg);
        box.innerHTML = '平均分 <b>' + avg.toFixed(2) + '</b> → 按表4每人 <b>' + (adj >= 0 ? '+' : '') + adj + '</b> 分，将写入 ' + rm.members.length + ' 名成员';
      });
    });
}
function saveWeek(roomId) {
  var rm = null; for (var i = 0; i < APP.data.rooms.length; i++) if (APP.data.rooms[i].id === roomId) rm = APP.data.rooms[i];
  var week = parseInt($('wkNo').value, 10) || 1, date = $('wkDate').value || today();
  var ins = document.querySelectorAll('.wkDay'), vs = [];
  for (var j = 0; j < ins.length; j++) if (ins[j].value !== '') vs.push(num(ins[j].value, 0));
  if (!vs.length) return toast('请至少填写一天的分值');
  var avg = Math.round(vs.reduce(function (a, b) { return a + b; }, 0) / vs.length * 100) / 100;
  var adj = dormAdjust(avg);
  var w = { id: uid(), roomId: roomId, term: APP.data.settings.term, week: week, days: vs, avg: avg, adjust: adj, date: date };
  var old = null;
  APP.data.dormWeeks.forEach(function (x) { if (x.roomId === roomId && x.week === week && x.term === w.term) old = x; });
  if (old) delWeekRecords(old.id);
  APP.data.dormWeeks = APP.data.dormWeeks.filter(function (x) { return !(x.roomId === roomId && x.week === week && x.term === w.term); });
  APP.data.dormWeeks.push(w);
  var name = '宿舍卫生第' + week + '周（平均' + avg.toFixed(1) + '分）';
  rm.members.forEach(function (sid) {
    addRecord({ type: adj >= 0 ? 'add' : 'sub', sid: sid, name: name, cat: '宿舍卫生', val: Math.abs(adj), note: rm.name, date: date, dormWeek: w.id });
  });
  if (adj !== 0) { /* 0 分不登记 */ }
  APP.data.records = APP.data.records.filter(function (r) { return !(r.dormWeek === w.id && r.val === 0); });
  commit('录入宿舍第' + week + '周卫生分：' + rm.name + ' 平均' + avg + ' → 每人' + (adj >= 0 ? '+' : '') + adj);
  closeDialog(); toast('已写入 ' + rm.members.length + ' 人'); render();
}
function delWeekRecords(wid) {
  APP.data.records = APP.data.records.filter(function (r) { return r.dormWeek !== wid; });

function delWeek(id) {

function importPreset() {
  var inp = document.createElement('input');

  inp.style.display = 'none';

    var f = inp.files && inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result).replace(/^\uFEFF/, ''));
        if (!d.users || !d.users.length) return toast('文件格式不对，请选择全班数据 JSON');
        APP.data = mergeData(d, APP.data);
        APP.data.meta.presetRev = (d.meta && d.meta.presetRev) || (d.meta && d.meta.rev) || 1;
        saveLocal(); render();
        toast('已导入最新数据（v' + APP.data.meta.presetRev + '）');
      } catch (e) { toast('导入失败：' + e.message); }
    };

}

var CLOUD_FILE = 'jibao261.json';

function ajax(method, url, body, headers, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.setRequestHeader('Content-Type', 'application/json');
    if (headers) for (var k in headers) if (headers[k] != null) x.setRequestHeader(k, headers[k]);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) cb(null, x.responseText);
      else cb(new Error('HTTP ' + x.status + ' ' + (x.responseText || '').slice(0, 120)), null);
    };
    x.onerror = function () { cb(new Error('网络错误'), null); };
    x.ontimeout = function () { cb(new Error('请求超时'), null); };
    x.send(body == null ? null : body);
  } catch (e) { cb(e, null); }
}
function syncMsg(msg, keep) {

  if (!msg) { b.className = 'syncbar hide'; return; }

function cloudCfg() { return (APP.data && APP.data.settings && APP.data.settings.cloud) || { type: 'none' }; }

/* 云端冲突时自动合并：以云端为底，补入本地新增记录、本机改过的密码与自评 */
function mergeData(remote, local) {
  var base = JSON.parse(JSON.stringify(remote));
  if (!base.meta) base.meta = { rev: 1 };
  var lmeta = local.meta || { rev: 1 };
  var lNew = (lmeta.updatedAt || 0) > (remote.meta && remote.meta.updatedAt || 0);
  if (local.settings && local.settings.cloud && local.settings.cloud.gistId && (!base.settings.cloud || !base.settings.cloud.gistId)) {
    base.settings.cloud = local.settings.cloud;
  }
  var umap = {}; base.users.forEach(function (u, i) { umap[u.id] = i; });
  local.users.forEach(function (lu) {
    var i = umap[lu.id];
    if (i == null) { base.users.push(JSON.parse(JSON.stringify(lu))); return; }
    var bu = base.users[i];
    if (lu.pwdAt && (!bu.pwdAt || String(lu.pwdAt) > String(bu.pwdAt))) {
      bu.salt = lu.salt; bu.hash = lu.hash; bu.mustChange = lu.mustChange; bu.pwdAt = lu.pwdAt;
    }
    if (lu.eval) {
      bu.eval = bu.eval || {};
      for (var t in lu.eval) {
        var le = lu.eval[t], be = bu.eval[t] || {};
        if (le.selfAt && (!be.selfAt || String(le.selfAt) > String(be.selfAt))) { be.self = le.self; be.text = le.text; be.selfAt = le.selfAt; }
        if (le.at && (!be.at || String(le.at) > String(be.at))) { be.counselor = le.counselor; be.by = le.by; be.at = le.at; }
        bu.eval[t] = be;
      }
    }
    if (lNew && lu.role && lu.role !== bu.role) bu.role = lu.role;
  });
  function union(key, arrL) {
    var m = {}; base[key].forEach(function (r) { m[r.id] = 1; });
    arrL.forEach(function (r) { if (!m[r.id]) base[key].push(JSON.parse(JSON.stringify(r))); });
  }
  union('records', local.records || []);
  union('rooms', local.rooms || []);
  union('appeals', local.appeals || []);
  var wk = {}; base.dormWeeks.forEach(function (w) { wk[w.roomId + '_' + w.week + '_' + (w.term || '')] = w.id; });
  (local.dormWeeks || []).forEach(function (w) {
    var k = w.roomId + '_' + w.week + '_' + (w.term || '');
    if (wk[k]) base.dormWeeks = base.dormWeeks.filter(function (x) { return x.id !== wk[k]; });
    base.dormWeeks.push(JSON.parse(JSON.stringify(w)));
  });
  var lk = {}; base.logs.forEach(function (l) { lk[l.t + '|' + l.who + '|' + l.msg] = 1; });
  (local.logs || []).forEach(function (l) {
    var k = l.t + '|' + l.who + '|' + l.msg;
    if (!lk[k]) { base.logs.push(l); lk[k] = 1; }
  });
  base.logs.sort(function (a, b) { return String(b.t) < String(a.t) ? -1 : 1; });
  if (base.logs.length > 500) base.logs.length = 500;
  base.meta = {
    rev: Math.max(remote.meta && remote.meta.rev || 0, lmeta.rev || 0),
    updatedAt: Date.now(),
    seed: (remote.meta && remote.meta.seed) || lmeta.seed || 0,
    syncedAt: remote.meta && remote.meta.syncedAt,
    termBonusDone: (remote.meta && remote.meta.termBonusDone) || lmeta.termBonusDone || false
  };
  return base;
}

function cloudRead(cb) {
  var c = cloudCfg();
  if (c.type === 'gist') {
    if (!c.gistId) return cb(null, null);
    ajax('GET', 'https://api.github.com/gists/' + c.gistId + '?t=' + Date.now(), null,
      { 'Authorization': 'token ' + c.gistToken, 'Accept': 'application/vnd.github+json' }, function (e, t) {
        if (e) return cb(e);
        try {
          var j = JSON.parse(t);
          var f = j.files && j.files[CLOUD_FILE];
          if (!f) return cb(new Error('云端文件中没有 ' + CLOUD_FILE));
          cb(null, JSON.parse(f.content));
        } catch (err) { cb(err); }
      });
  } else if (c.type === 'jsonblob') {
    if (!c.gistId) return cb(null, null);
    ajax('GET', 'https://jsonblob.com/api/jsonBlob/' + c.gistId + '?t=' + Date.now(), null, {}, function (e, t) {
      if (e) return cb(e);
      try { cb(null, JSON.parse(t)); } catch (err) { cb(err); }
    });
  } else if (c.type === 'rest') {
    if (!c.restGet) return cb(null, null);
    var h = {}; try { if (c.restHeaders) h = JSON.parse(c.restHeaders); } catch (e) {}
    ajax('GET', c.restGet + (c.restGet.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), null, h, function (e, t) {
      if (e) return cb(e);
      try { cb(null, JSON.parse(t)); } catch (err) { cb(err); }
    });
  } else cb(null, null);
}
function cloudWrite(obj, cb) {
  var c = cloudCfg(), body = JSON.stringify(obj);
  if (c.type === 'gist') {
    var hdr = { 'Authorization': 'token ' + c.gistToken, 'Accept': 'application/vnd.github+json' };
    var files = {}; files[CLOUD_FILE] = { content: body };
    if (c.gistId) {
      ajax('PATCH', 'https://api.github.com/gists/' + c.gistId, JSON.stringify({ files: files }), hdr, cb);
    } else {
      ajax('POST', 'https://api.github.com/gists', JSON.stringify({
        description: '继保261 操行分管理系统数据', public: false, files: files
      }), hdr, function (e, t) {
        if (e) return cb(e);
        try { APP.data.settings.cloud.gistId = JSON.parse(t).id; saveLocal(); cb(null, t); }
        catch (err) { cb(err); }
      });
    }
  } else if (c.type === 'jsonblob') {
    var jbUrl = 'https://jsonblob.com/api/jsonBlob' + (c.gistId ? '/' + c.gistId : '');
    ajax(c.gistId ? 'PUT' : 'POST', jbUrl, body, {}, function (e, t, xhr) {
      if (e) return cb(e);
      if (!c.gistId && xhr) {
        var loc = xhr.getResponseHeader('Location') || '';
        var id = loc.split('/').pop();
        if (id) { APP.data.settings.cloud.gistId = id; saveLocal(); }
      }
      cb(null, t);
    });
  } else if (c.type === 'rest') {
    if (!c.restPut) return cb(new Error('未填写写入地址'));
    var h = {}; try { if (c.restHeaders) h = JSON.parse(c.restHeaders); } catch (e) {}
    ajax('PUT', c.restPut, body, h, function (e, t) { if (e) return cb(e); cb(null, t); });
  } else cb(new Error('未启用云端'));
};

function cloudPush(force) {
  var c = cloudCfg();
  if (!APP.data || c.type === 'none') return;
  if (force) { pushNow(true); return; }
  if (_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(function () { pushNow(false); }, 2500);
}
function pushNow(force) {
  var c = cloudCfg();
  if (c.type === 'none') return;
  if (APP.syncing) return;
  APP.syncing = true; syncMsg('☁️ 正在同步到云端…', true);
  cloudRead(function (e, remote) {
    if (e) { APP.syncing = false; syncMsg('⚠️ 同步失败：' + e.message); return; }
    var rrev = remote && remote.meta ? (remote.meta.rev || 0) : 0;
    var lrev = APP.data.meta.rev || 0;
    if (!force && rrev > lrev) {
      /* 自动合并：以云端为底，保留本机新增的记录、改过的密码与自评，再上传 */
      var keep = APP.me ? { id: APP.me.id } : null;
      APP.data = mergeData(remote, APP.data);
      if (keep) { var ku = findUser(keep.id); if (ku) APP.me = ku; }
      saveLocal();
      syncMsg('☁️ 已合并云端新数据（v' + rrev + '）并继续上传…', true);
    }
    APP.data.meta.rev = Math.max(lrev, rrev) + 1;
    cloudWrite(APP.data, function (e2) {
      APP.syncing = false;
      if (e2) { syncMsg('⚠️ 上传失败：' + e2.message); return; }
      APP.data.meta.syncedAt = nowTime(); saveLocal();
      syncMsg('✅ 已同步到云端（v' + APP.data.meta.rev + '）');
      if (APP.view === 'manage') render();
    });
  });
}
function cloudPull(manual) {
  var c = cloudCfg();
  if (c.type === 'none') { if (manual) toast('当前为本地单机模式'); return; }
  syncMsg('☁️ 正在从云端读取…', true);
  cloudRead(function (e, remote) {
    if (e) { syncMsg('⚠️ 读取失败：' + e.message); if (manual) toast('读取失败：' + e.message); return; }
    if (!remote || !remote.users) { syncMsg('云端暂无数据，将上传本地数据'); pushNow(true); return; }
    var rrev = remote.meta ? (remote.meta.rev || 0) : 0, lrev = APP.data.meta.rev || 0;
    if (!manual && rrev <= lrev) { syncMsg('✅ 已是最新（v' + lrev + '）'); return; }
    if (manual && rrev < lrev) {
      confirmBox('版本确认', '云端版本 v' + rrev + ' 低于本地 v' + lrev + '，确定要用云端覆盖本地吗？', function () {
        APP.data = remote; saveLocal(); APP.me = null; render(); toast('已从云端恢复');
      });
      syncMsg('');
      return;
    }
    APP.data = remote; saveLocal();
    syncMsg('✅ 已同步云端数据（v' + rrev + '）');
    if (manual) toast('已拉取云端最新数据');
    if (APP.me && !findUser(APP.me.id)) APP.me = null;
    render();
  });
}

}

    mustChange: true, disabled: false, eval: {}, createdAt: nowTime()
  };
  if (extra) for (var k in extra) u[k] = extra[k];
  return u;
}
function seed() {
  var d = APP.data;
  d.users = [];
  d.users.push(mkUser('admin', '最高管理员', 'superadmin'));
  d.users.push(mkUser('fudaoyuan', '辅导员', 'counselor'));
  ROSTER_DATA.forEach(function (r) {
    d.users.push(mkUser(r[0], r[1], 'student', { gender: r[2], phone: r[3], isClass: true }));
  });
  d.settings.initialized = true;
  d.meta.seed = 1;
  addLog('系统初始化：导入班级名单 ' + ROSTER_DATA.length + ' 人');
}
function showHelp() {
  dialog('使用说明',
    '<div style="font-size:13.5px;line-height:1.8">' +
    '<b>1. 登录</b>：学生账号为本人学号，初始密码 123456；首次登录必须修改密码后才能使用。<br>' +
    '<b>2. 权限</b>：最高管理员（全部权限）→ 班委管理员（登记加减分、宿舍评分、处理申诉）→ 辅导员（只读，仅查看与导出）→ 学生（仅查看本人）。<br>' +
    '<b>3. 计分</b>：学期操行分 = 基础分 50 + 导员评价 20 + 自我评价 5 + 加减分项目（加分累计不超过 25 分）。合格线 90 分。<br>' +
    '<b>4. 云端</b>：最高管理员在「管理 → 云端存储」中开启「免注册云端」或 GitHub Gist，全班共用一份数据，登记后自动上传。<br>' +
    '<b>5. 分发给全班</b>：管理员开启云端后，点「生成分发文件」，把生成的文件发到班级群；同学打开即自动连接同一份数据，无需任何配置。<br>' +
    '<b>6. 转发</b>：本页是单文件网页，微信、QQ、手机与电脑浏览器均可直接打开，也可上传到任意静态托管变成链接。</div>',
    '<button class="btn" onclick="closeDialog()">知道了</button>');
}
/* 生成「全班分发版」：把当前云端配置烧进 HTML，同学打开即自动连同一份数据 */
function makeDistFile() {
  if (!canManage()) return toast('仅最高管理员可生成分发文件');
  var c = APP.data.settings.cloud || {};
  if (c.type === 'none' || !c.gistId) return toast('请先在「云端存储」中开启云端并保存配置，拿到云端 ID 后再生成');
  var src = (typeof PAGE_SRC !== 'undefined' && PAGE_SRC) ? PAGE_SRC : null;
  if (!src) return toast('当前文件不支持自动生成，请把云端 ID 发给开发者生成');
  var preset = {
    type: c.type, gistId: c.gistId,
    gistToken: (c.type === 'gist' ? (c.gistToken || '') : ''),
    restGet: c.restGet || '', restPut: c.restPut || '', restHeaders: c.restHeaders || ''
  };
  var inject = '<script>var PRESET_CLOUD=' + JSON.stringify(preset) + ';<' + '/script>';
  var out = src.replace('<script>', inject + '<script>');
  if (out === src) return toast('生成失败：未找到注入点');
  download(APP.data.settings.className + '操行分系统_全班分发版.html', out, 'text/html');
  toast('已生成：把该文件发到班级群即可');
}
function copyText(t, tip) {
  try {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast(tip || '已复制');
  } catch (e) { toast('复制失败，请手动选中复制'); }
}
function showRules() {
  var a = ADD_ITEMS.map(function (x) {
    return '<div class="kv"><span>' + esc(x.name) + '</span><b>+' + (x.fixed ? x.val : (x.hours ? '0.5/小时，单次≤' + x.cap : x.min + '-' + x.max)) + '</b></div>';
  }).join('');
  var b = SUB_ITEMS.map(function (x) {
    return '<div class="kv"><span>' + esc(x.name) + '</span><b class="no">-' + (x.fixed ? x.val : x.min + '-' + x.max) + '</b></div>';
  }).join('');
  dialog('评分标准速查（细则表2/表3/表4）',
    '<div style="font-size:13.5px"><b>一、加分项目</b>' + a +
    '<hr class="sep"><b>二、减分项目</b>' + b +
    '<hr class="sep"><b>三、宿舍卫生阶梯（周平均分）</b>' +
    '<div class="kv"><span>96分及以上</span><b>每高1分加1分（100→+8）</b></div>' +
    '<div class="kv"><span>95分</span><b>+3</b></div>' +
    '<div class="kv"><span>90-94分</span><b>每高1分加0.5（90→+0.5）</b></div>' +
    '<div class="kv"><span>85-89分</span><b>+0.5</b></div>' +
    '<div class="kv"><span>80-84分</span><b>0</b></div>' +
    '<div class="kv"><span>79-75分</span><b class="no">-0.5</b></div>' +
    '<div class="kv"><span>75分以下</span><b class="no">每降1分扣0.2（最多-5）</b></div>' +
    '<div class="kv"><span>学期每周均≥90分</span><b>学期末每人+1</b></div>' +
    '<div class="note">同一项目或赛事获多个奖项按最高奖次加分，不重复累计；每学期加分累计不超过 25 分。</div></div>',
    '<button class="btn" onclick="closeDialog()">关闭</button>');
}
function boot() {
  APP.data = loadLocal();
  if (!APP.data || !APP.data.users || !APP.data.users.length) {
    APP.data = defaults(); seed(); saveLocal();
  }
  var s = APP.data.settings;
  if (!s.cloud) s.cloud = { type: 'none', gistId: '', gistToken: '', restGet: '', restPut: '', restHeaders: '' };
  /* 内置数据快照：网页里自带最新全班数据，同学打开即看到最新分，无需任何配置 */
  if (window.PRESET_DATA && window.PRESET_DATA.users && window.PRESET_DATA.users.length) {
    var pd = window.PRESET_DATA, pr = pd.meta && pd.meta.presetRev || 1;
    var lpr = APP.data.meta && APP.data.meta.presetRev || 0;
    if (!lpr && (APP.data.meta.rev || 1) <= 1 && !(APP.data.records || []).length) {
      APP.data = JSON.parse(JSON.stringify(pd));   /* 新设备：直接用网页内置的最新数据 */
    } else if (pr > lpr) {
      APP.data = mergeData(pd, APP.data);          /* 老设备：以最新数据为底，保留本机新增 */
    }
    APP.data.meta.presetRev = pr;
    saveLocal();
  }
  if (!APP.data.rooms) APP.data.rooms = [];
  if (!APP.data.dormWeeks) APP.data.dormWeeks = [];
  if (!APP.data.appeals) APP.data.appeals = [];
  if (!APP.data.logs) APP.data.logs = [];
  if (!APP.data.meta) APP.data.meta = { rev: 1, updatedAt: Date.now() };
  /* 内置云端配置（分发版） */
  if (window.PRESET_CLOUD && window.PRESET_CLOUD.type) {
    var pc = window.PRESET_CLOUD, cur = s.cloud || {};
    if (!cur.type || cur.type === 'none' || !cur.gistId) s.cloud = pc;
    saveLocal();
  }
  /* 链接携带云端配置：?cloud=ID&ct=类型&get=..&put=.. （把带参数的链接发给同学即可共用同一份数据） */
  try {
    var q = location.search || '';
    if (q) {
      var p = {};
      q.replace(/^\?/, '').split('&').forEach(function (kv) {
        var a = kv.split('='); if (a[0]) p[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
      });
      if (p.cloud) {
        var t = p.ct || 'jsonblob';
        s.cloud = { type: t, gistId: p.cloud, gistToken: p.tok || '', restGet: p.get || '', restPut: p.put || '', restHeaders: p.head || '' };
        saveLocal();
      }
    }
  } catch (e) {}
  render();
  autoPull();
  window.APP = APP;
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { boot: boot }; }
boot();

</script>
